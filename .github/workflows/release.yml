# 태그를 밀면 그것이 곧 배포다 (설계문서 §12).
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# 손으로 하던 것 — 시험 · 번들 조립 · zip · 릴리스 · cask 의 sha256 갱신 —
# 은 사람이 한 번만 빠뜨려도 «내려받은 것이 안 열린다» 로 끝난다. 특히
# sha256 은 틀려도 만든 사람 기계에서는 아무 일도 안 일어나고, 받는 사람에게만
# 터진다. 그래서 사람의 손을 태그 하나로 줄인다.
name: release

on:
  push:
    tags: ["v*"]
  # 같은 태그로 다시 낼 때.
  workflow_dispatch:
    inputs:
      tag:
        description: "다시 낼 태그 (예: v0.1.0)"
        required: true
      force:
        description: "이미 나간 자산을 덮어쓴다 — 탭도 함께 갱신될 때만"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # 이 앱은 플랫폼 목표가 macOS 26 이라 그보다 낮은 러너에서는 **컴파일 자체가 안 된다.**
    runs-on: macos-26

    # `secrets` 는 step 의 `if` 에서 못 읽는다 (허용 컨텍스트에 없다 — 여기에
    # 직접 쓰면 워크플로가 통째로 파싱에 실패한다). 한 번 env 로 받아서 본다.
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}

    steps:
      # 릴리스 노트가 «지난 태그 이후» 를 세므로 얕게 받으면 셀 것이 없다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 무엇으로 짓는지 적어 둔다
        run: |
          sw_vers
          swift --version

      - name: 판 정하기
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          # 태그와 번들이 다른 판이면 여기서 멈춘다. 이것이 어긋난 채 나가면
          # 사용자가 받은 앱의 «정보» 와 릴리스 이름이 서로 다른 말을 한다.
          if [ "$TAG" != "v$PLIST" ]; then
            echo "::error::태그($TAG)와 Info.plist($PLIST)가 다른 판입니다"
            exit 1
          fi
          SWIFT=$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/LazyMemoCore/Version.swift)
          if [ "$SWIFT" != "$PLIST" ]; then
            echo "::error::Version.swift($SWIFT)와 Info.plist($PLIST)가 다릅니다"
            exit 1
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$PLIST"    >> "$GITHUB_OUTPUT"

      # **빨간 것은 내보내지 않는다.** 배포는 시험을 건너뛰기 가장 좋은 자리다.
      - name: 시험
        run: ./scripts/test.sh

      - name: 묶기
        id: pkg
        run: |
          ./scripts/package-release.sh
          ZIP="dist/lazymemo-${{ steps.v.outputs.version }}.zip"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 릴리스 노트 짓기
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.v.outputs.tag }}^" 2>/dev/null || true)
          {
            cat .github/release-header.md
            echo
            echo "## 바뀐 것"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..${{ steps.v.outputs.tag }}"
              echo
              echo "[$PREV → ${{ steps.v.outputs.tag }}](https://github.com/${{ github.repository }}/compare/$PREV...${{ steps.v.outputs.tag }})"
            else
              echo "- 첫 판"
            fi
          } > /tmp/notes.md
          # 헤더의 자리표시자를 이번 판으로 바꾼다.
          sed -i '' "s/{{VERSION}}/${{ steps.v.outputs.version }}/g" /tmp/notes.md

      # **이미 나간 판의 바이트는 바꾸지 않는다.**
      #
      # 같은 소스라도 빌드한 기계가 다르면 zip 의 바이트가 다르다 — 그래서 자산을
      # 다시 올리는 순간 cask 에 적힌 sha256 이 어긋나고, 그때부터 `brew install` 은
      # checksum mismatch 로 끝난다. 실제로 한 번 그렇게 깨뜨려 봤다: 만든 사람
      # 기계에서는 아무 일도 안 일어나고 받는 사람에게만 터진다.
      #
      # 그래서 덮어쓰기는 **일부러 골라야** 한다. 대개 옳은 답은 판을 올리는 것이다.
      - name: 내보내기
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          NAME="$(basename "$ZIP")"

          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$NAME"; then
            if [ "$FORCE" != "true" ]; then
              echo "::error::$TAG 에 이미 $NAME 이 나가 있습니다. 바이트를 바꾸면 cask 의 sha256 이 어긋나 설치가 깨집니다 — 판을 올리거나, 탭을 함께 갱신할 수 있을 때 force 로 다시 실행하세요."
              exit 1
            fi
            gh release upload "$TAG" "$ZIP" --clobber
          elif gh release view "$TAG" >/dev/null 2>&1; then
            # 판은 있는데 자산이 없다 — 손으로 다듬어 둔 노트는 그대로 두고 붙이기만 한다.
            gh release upload "$TAG" "$ZIP"
          else
            gh release create "$TAG" "$ZIP" \
              --title "lazymemo ${{ steps.v.outputs.version }}" \
              --notes-file /tmp/notes.md
          fi

      # cask 의 sha256 은 **틀려도 만든 사람 기계에서는 아무 일도 안 일어난다.**
      # 받는 사람에게만 터지는 값이라 손으로 옮기지 않는다.
      #
      # 다른 저장소에 쓰므로 기본 토큰으로는 안 된다.
      #
      # **개인 토큰(PAT)이 아니라 배포 키를 쓴다.** PAT 는 그 사람이 가진 모든
      # 저장소에 닿지만, 배포 키는 **탭 하나**에만 쓰기가 된다. 이 워크플로가
      # 할 일이 딱 그것뿐이라 더 넓은 열쇠를 CI 에 둘 이유가 없다 — 새는 순간
      # 잃는 것의 크기가 다르고, 거두는 것도 이 키 하나만 지우면 된다.
      - name: 홈브루 탭 갱신
        if: ${{ env.TAP_DEPLOY_KEY != '' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          # 파일로 내릴 때만 잠깐 존재한다. 러너는 실행이 끝나면 통째로 사라진다.
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 \
            "git@github.com:${{ github.repository_owner }}/homebrew-lazymemo.git" /tmp/tap
          cd /tmp/tap
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/lazymemo.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/lazymemo.rb
          if git diff --quiet; then
            echo "탭이 이미 ${VERSION} 입니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: lazymemo ${VERSION}"
          git push

      # 탭을 못 갱신했으면 **끝난 상태가 깨진 것**이다 — 방금 나간 zip 과 cask 에
      # 적힌 sha256 이 어긋나 있다. 릴리스는 이미 나갔지만 실행은 빨갛게 둔다.
      # 초록인데 설치가 안 되는 것이 가장 나쁘다.
      - name: 탭을 못 갱신했다
        if: ${{ env.TAP_DEPLOY_KEY == '' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          {
            echo "### 릴리스는 나갔지만 홈브루 탭이 그것을 모릅니다"
            echo
            echo "\`TAP_DEPLOY_KEY\` 시크릿이 없어 갱신을 건너뛰었습니다."
            echo "**지금 \`brew install --cask lazymemo\` 는 checksum mismatch 로 실패합니다.**"
            echo "\`bunhine0452/homebrew-lazymemo\` 의 \`Casks/lazymemo.rb\` 를 이렇게 고치세요."
            echo
            echo '```ruby'
            echo "  version \"${VERSION}\""
            echo "  sha256 \"${SHA}\""
            echo '```'
            echo
            echo "다음부터 자동으로 하려면 탭의 쓰기 배포 키를"
            echo "\`TAP_DEPLOY_KEY\` 시크릿으로 넣으세요."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::탭이 갱신되지 않아 cask 의 sha256 이 어긋나 있습니다 (요약 참고)"
          exit 1
